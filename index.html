<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pencil HTML Pages</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #202124;
      background: #f7f7f4;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    main {
      width: min(720px, calc(100vw - 40px));
      padding: 48px 0;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 28px;
      color: #5f6368;
      line-height: 1.6;
    }

    .links {
      display: grid;
      gap: 12px;
    }

    a {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      padding: 18px 20px;
      border: 1px solid #dedbd2;
      border-radius: 8px;
      background: #fff;
      color: inherit;
      text-decoration: none;
      font-size: 17px;
      font-weight: 650;
      transition: border-color .15s ease, transform .15s ease;
    }

    a:hover {
      border-color: #8f8a7e;
      transform: translateY(-1px);
    }

    span {
      color: #70757a;
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
    }

    @media (max-width: 520px) {
      a {
        align-items: flex-start;
        flex-direction: column;
      }

      span {
        white-space: normal;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Pencil HTML Pages</h1>
    <p>공개용 HTML 페이지 목록입니다.</p>
    <div class="links">
      <a href="laon-detail.html">라온성형외과 상세 <span>laon-detail.html</span></a>
      <a href="medistudio-2.html">메디스튜디오 2.0 <span>medistudio-2.html</span></a>
    </div>
  </main>
</body>
</html>
